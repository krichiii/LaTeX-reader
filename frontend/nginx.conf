server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Just above the backend's 10 MB limit (LATEX_OCR_MAX_UPLOAD_MB), so the backend's
    # JSON error answers oversize uploads instead of an nginx HTML page.
    client_max_body_size 11m;

    location / {
        try_files $uri $uri/ =404;
        # Ask the server every time, so a new design shows up without a hard reload.
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        # Resolve "backend" through Docker's DNS on each request, so nginx starts even
        # while the backend container is still loading or restarting.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:5000;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
